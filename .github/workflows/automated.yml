name: Automated Workflow
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - name: Shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: for script in scripts/android/*.sh scripts/ios/*.sh; do bash -n "$script" || exit; done
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm run build:native

  about:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Sync package.json description to GitHub About
        env:
          GH_TOKEN: ${{ secrets.GITHUB }}
        run: |
          description=$(jq -r '.description // empty' package.json)
          if [ -n "$description" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f description="$description"
          else
            echo "No package description found; skipping GitHub About update."
          fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Semantic Release and plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/npm \
            @semantic-release/github \
            @semantic-release/git
      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
